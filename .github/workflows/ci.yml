name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fast:
    name: fast (analyze + unit/widget + cobertura)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter analyze

      # `make coverage` roda a mesma suíte que `flutter test test/unit
      # test/widget` rodava aqui, com --coverage, e reprova se o piso cair.
      # Rodar as duas dobraria o tempo do job para provar a mesma coisa.
      - run: make coverage

  integration:
    name: integration (Supabase local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase start

      - run: flutter pub get
      - run: dart test test/integration

      - if: always()
        run: supabase stop

  build-web:
    name: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter build web
