name: deploy-web

# Build Flutter Web (produção, Supabase Cloud real) e publica em uma branch
# só de artefato (dist-web) — o padrão já usado no resto do portfólio
# (CI builda+publica, a VM só puxa; nunca deploy via SSH direto). Como iasd
# é 100% estático, "publicar" aqui é a branch, não um registry de imagem —
# não existe container pra esse app.
#
# 🔴 SEGURANÇA — histórico: até 2026-08-10, `.env` era `assets:` no
# pubspec.yaml, e um `flutter build web` local (fora deste workflow, com o
# .env de trabalho de um desenvolvedor) publicou por engano a senha do
# Administrador no bundle público. Achado em pentest, corrigido removendo
# `.env` dos assets — `SUPABASE_URL`/`SUPABASE_PUBLISHABLE_KEY` agora são
# constante de compilação via `--dart-define` (lib/core/supabase_client.dart).
# Não existe mais arquivo `.env` para vazar: nenhum `flutter build web`,
# local ou daqui, embute segredo de desenvolvedor por acidente. Ainda assim,
# NUNCA passe `SUPABASE_SERVICE_ROLE_KEY` nem `ADMIN_*` como `--dart-define`
# aqui — as duas chaves abaixo são as únicas seguras por design (RLS).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build web (produção, via --dart-define)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Publica build/web na branch dist-web
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build/web
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b dist-web
          git add -A
          git commit -q -m "deploy-web: $SHA"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" dist-web:dist-web
