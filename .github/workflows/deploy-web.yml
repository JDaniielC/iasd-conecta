name: deploy-web

# Build Flutter Web (produção, Supabase Cloud real) e sobe o resultado como artifact do
# GitHub Actions. Publicação em Cloud Storage + CDN é MANUAL, feita com `make deploy-web`
# (Makefile, raiz do repo) — não roda no CI. Motivo, e quando isso muda: fonte única em
# `.tickets/IASD-CI-GCS-UPLOAD.md`. Desenho completo: `specs/020-deploy-gcs-cdn/`.
#
# ⚠️ TEMPORÁRIO: o desenho original publicava daqui, autenticado por chave JSON de conta de
# serviço (`GCP_SERVICE_ACCOUNT_JSON`). A política de organização do GCP
# `iam.disableServiceAccountKeyCreation` — "Secure by Default", aplicada automaticamente pelo
# Google — bloqueia criar essa chave, no projeto e na organização. Sem chave, o CI não
# autentica. Workaround pedido ao Google Cloud Support; enquanto não volta, quem publica roda
# `make deploy-web` na própria máquina, autenticado com a própria conta (`gcloud auth login`).
#
# 🔴 SEGURANÇA — histórico: até 2026-08-10, `.env` era `assets:` no pubspec.yaml, e um
# `flutter build web` local (fora deste workflow, com o .env de trabalho de um desenvolvedor)
# publicou por engano a senha do Administrador no bundle público. Achado em pentest, corrigido
# removendo `.env` dos assets — `SUPABASE_URL`/`SUPABASE_PUBLISHABLE_KEY` agora são constante
# de compilação via `--dart-define` (lib/core/supabase_client.dart). Não existe mais arquivo
# `.env` para vazar: nenhum `flutter build web`, local ou daqui, embute segredo de
# desenvolvedor por acidente.
#
# Duas regras que sobrevivem a esse conserto:
#   1. NUNCA passe `SUPABASE_SERVICE_ROLE_KEY` nem `ADMIN_*` como `--dart-define`. O que entra
#      em --dart-define entra no JavaScript publicado, legível por qualquer pessoa. As duas
#      chaves abaixo são as únicas seguras por design (RLS).
#   2. NUNCA reaproveite `cp .env.example .env` aqui. Esse arquivo lista
#      SUPABASE_SERVICE_ROLE_KEY junto das chaves públicas, e ele existe hoje só para
#      `scripts/bootstrap_admin.sh`, que roda em bash e nunca vai para dentro de build nenhum.

# openspec/changes/travar-deploy-com-teste-vermelho: antes disparava em todo
# `push` para `main`, sem depender do resultado de `ci.yml` — um commit que
# quebrava `flutter analyze`/teste ainda construía e publicava o artefato.
# `needs:` exigiria fundir os dois workflows num só (públicos diferentes:
# `ci.yml` roda em toda branch/PR, este só interessa em `main`), então a
# dependência é por `workflow_run` sobre a CONCLUSÃO do `ci.yml` em `main`.
#
# ⚠️ `workflow_run` dispara sempre que o workflow observado termina, sucesso OU
# falha — por isso o job abaixo tem `if: ... conclusion == 'success'`. Sem essa
# guarda, este workflow rodaria (e publicaria) mesmo com `ci.yml` vermelho.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # workflow_dispatch não tem workflow_run.conclusion (é manual, publica sob
    # demanda); workflow_run só segue se ci.yml terminou com sucesso.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Pina no commit exato que o ci.yml validou — sem isto, o checkout de
          # um evento workflow_run resolve para o HEAD atual da branch default,
          # que pode já ter avançado se outro push chegou entre o fim do ci.yml
          # e este job rodar. github.sha cobre o caso workflow_dispatch, onde
          # workflow_run.head_sha não existe.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web (produção, via --dart-define)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      # FR-013 / SC-004, reescrito com o conserto de 2026-08-10.
      #
      # O passo anterior abria `build/web/assets/.env` e conferia se só as duas chaves públicas
      # tinham viajado — ou seja, aceitava que o arquivo viajasse, e vigiava o conteúdo. Agora a
      # garantia é mais forte e mais simples: o arquivo não pode existir. Se ele voltar a
      # existir, alguém devolveu `.env` para `assets:` no pubspec.yaml, e o caminho do vazamento
      # está reaberto — inclusive para quem publicar à mão com `make deploy-web`.
      - name: Verify no .env was bundled
        run: |
          if [ -e build/web/assets/.env ]; then
            echo "::error::build/web/assets/.env existe. Alguém devolveu .env para assets: no pubspec.yaml — é o caminho do vazamento de 2026-08-10."
            exit 1
          fi

      - name: Upload build/web as artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-web
          path: build/web
          retention-days: 14
