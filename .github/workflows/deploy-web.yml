name: deploy-web

# Build Flutter Web (produção, Supabase Cloud real) e sobe o resultado como artifact do
# GitHub Actions. Publicação em Cloud Storage + CDN é MANUAL, feita com `make deploy-web`
# (Makefile, raiz do repo) — não roda no CI. Motivo, e quando isso muda: fonte única em
# `.tickets/IASD-CI-GCS-UPLOAD.md`. Desenho completo: `specs/020-deploy-gcs-cdn/`.
#
# ⚠️ TEMPORÁRIO: o desenho original publicava daqui, autenticado por chave JSON de conta de
# serviço (`GCP_SERVICE_ACCOUNT_JSON`). A política de organização do GCP
# `iam.disableServiceAccountKeyCreation` — "Secure by Default", aplicada automaticamente pelo
# Google — bloqueia criar essa chave, no projeto e na organização. Sem chave, o CI não
# autentica. Workaround pedido ao Google Cloud Support; enquanto não volta, quem publica roda
# `make deploy-web` na própria máquina, autenticado com a própria conta (`gcloud auth login`).

# 🔴 SEGURANÇA: NUNCA reaproveitar `cp .env.example .env` (job `build-web` do ci.yml) aqui.
# Esse .env.example lista SUPABASE_SERVICE_ROLE_KEY junto das chaves públicas — e `.env` é
# `assets:` no pubspec.yaml, ou seja, vai JUNTO no build web público. Este job monta o .env de
# produção só com as DUAS variáveis seguras por design (RLS). Nunca adicionar
# SUPABASE_SERVICE_ROLE_KEY nem ADMIN_* aqui.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Write production .env with the two public keys only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          cat > .env <<EOF
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release

      # FR-013 / SC-004 — `.env` é asset do pubspec, então ele vai DENTRO do bundle público, em
      # build/web/assets/.env. Este passo confere que só as duas chaves públicas viajaram, tanto
      # aqui quanto em quem publicar depois via `make deploy-web`. Conta nomes de chave; NUNCA
      # imprime valor.
      - name: Verify bundled .env carries only the two public keys
        run: |
          keys=$(grep -oE '^[A-Z_]+=' build/web/assets/.env | tr -d '=' | sort | tr '\n' ' ')
          expected="SUPABASE_PUBLISHABLE_KEY SUPABASE_URL "
          if [ "$keys" != "$expected" ]; then
            echo "::error::build/web/assets/.env tem chaves além das duas públicas. Encontrado: $keys"
            exit 1
          fi

      - name: Upload build/web as artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-web
          path: build/web
          retention-days: 14
