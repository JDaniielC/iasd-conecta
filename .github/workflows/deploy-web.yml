name: deploy-web

# Build Flutter Web (produção, Supabase Cloud real) e publica em uma branch
# só de artefato (dist-web) — o padrão já usado no resto do portfólio
# (CI builda+publica, a VM só puxa; nunca deploy via SSH direto). Como iasd
# é 100% estático, "publicar" aqui é a branch, não um registry de imagem —
# não existe container pra esse app.
#
# 🔴 SEGURANÇA: NUNCA reaproveitar `cp .env.example .env` (job `build-web`
# do ci.yml) aqui. Esse .env.example lista SUPABASE_SERVICE_ROLE_KEY junto
# das chaves públicas — e `.env` é `assets:` no pubspec.yaml, ou seja, vai
# JUNTO no build web público. Este job monta o .env de produção só com as
# DUAS variáveis seguras por design (RLS). Nunca adicionar
# SUPABASE_SERVICE_ROLE_KEY nem ADMIN_* aqui.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Monta .env de produção (só as 2 chaves públicas)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          cat > .env <<EOF
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
          EOF

      - run: flutter pub get
      - run: flutter build web --release

      - name: Publica build/web na branch dist-web
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build/web
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b dist-web
          git add -A
          git commit -q -m "deploy-web: $SHA"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" dist-web:dist-web
